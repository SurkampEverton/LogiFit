name: OWASP ZAP — weekly baseline scan

# Roda OWASP ZAP em ambiente staging toda segunda 02:00 UTC (regra 35 + ADR 0073).
# Alerts ≥ medium criam issue automaticamente; SARIF anexa ao Security tab.
#
# Pré-requisitos:
#   - Subdomínio `staging.logifit.com.br` apontando pra container isolado no
#     VPS Oracle (cópia da app, dados sintéticos) — bootstrap em Sprint 04+.
#   - Variável `STAGING_URL` em GitHub Actions secrets (default abaixo).
#
# Manual trigger via `workflow_dispatch` (útil pra teste local da pipeline).

on:
  schedule:
    - cron: '0 2 * * 1' # segunda 02:00 UTC = 23:00 SP domingo (fora do pico)
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL alvo (override do default staging)'
        required: false
        default: 'https://staging.logifit.com.br'

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  zap-baseline:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@5b1b69d09c47b14c81cf6c5c40e84a14b94727df # v0.14.0
        with:
          target: ${{ inputs.target_url || 'https://staging.logifit.com.br' }}
          allow_issue_writing: true
          fail_action: false # cria issue mas não derruba pipeline (review humano)
          cmd_options: '-a -j -m 10 -T 60'
          # -a: minimum alerts level (mostra info+low+medium+high)
          # -j: ajax spider (SPA)
          # -m 10: 10min máx spider
          # -T 60: 60min máx total
          issue_title: 'OWASP ZAP — alertas encontrados em staging'

      - name: Upload SARIF para Security tab
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.8
        if: always() && hashFiles('report_md.md') != ''
        with:
          sarif_file: report_md.md
        continue-on-error: true
